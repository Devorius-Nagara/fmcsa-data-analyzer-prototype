<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Inspection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>

<div class="page narrow" id="page"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const id = qs('id') || INSPECTIONS[0].id;
  const insp = getInspection(id) || INSPECTIONS[0];
  const c = getCompany(insp.dot);
  const provider = c ? getProvider(c.provider) : null;

  document.getElementById('page').innerHTML = `
    ${backLink(`company.html?dot=${insp.dot}`, `Back to company — ${c ? c.name : insp.dot}`)}

    <div class="card" style="padding:24px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <div style="font-size:20px; font-weight:700;">Inspection #${insp.id}</div>
          <span class="pill ${insp.oos ? 'pill-critical' : 'pill-minimal'}">OOS: ${insp.oos ? 'yes' : 'no'}</span>
        </div>
        <div style="font-size:13px; color:#52514e; margin-top:6px;">Vehicle Inspection File · preliminary data, updated 4:12 AM today</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#898781;">
        ${icon(ICONS.clock, { size: 14, stroke: '#898781' })} Can change for up to ~3 weeks (DataQs)
      </div>
    </div>

    <div class="card" style="padding:24px 28px; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:22px;">
      <div class="kv"><span class="k">Date</span><span class="v mono">${fmtDate(insp.date)}</span></div>
      <div class="kv"><span class="k">Inspection level</span><span class="v">${insp.level}</span></div>
      <div class="kv"><span class="k">State</span><span class="v">${insp.state}</span></div>
      <div class="kv"><span class="k">Location</span><span class="v">${insp.location}</span></div>
      <div class="kv"><span class="k">Company</span><span class="v">${c ? `<a href="company.html?dot=${c.dot}">${c.name}</a>` : '—'}</span></div>
      <div class="kv"><span class="k">DOT / MC</span><span class="v mono">${c ? `${c.dot} / ${c.mc}` : '—'}</span></div>
      <div class="kv"><span class="k">ELD provider</span><span class="v">${provider ? `<a href="provider.html?id=${provider.id}">${provider.name}</a>` : '—'}</span></div>
      <div class="kv"><span class="k">Vehicle</span><span class="v mono">${insp.vehicle}</span></div>
    </div>

    <div class="card" style="overflow:hidden;">
      <div style="padding:20px 24px; border-bottom:1px solid #e1e0d9; font-size:14px; font-weight:600;">Violations found during this inspection</div>
      ${insp.violations.length ? `
      <table style="font-size:14px;">
        <thead><tr><th>Code</th><th>Description</th><th>BASIC</th><th>Severity</th><th>OOS</th><th></th></tr></thead>
        <tbody>
          ${insp.violations.map(v => `
          <tr class="row-link" onclick="location.href='violation.html?id=${v.id}'">
            <td class="mono" style="color:#52514e;">${v.code}</td>
            <td>${v.desc}</td>
            <td>${v.basic}</td>
            <td class="mono">${v.severity} / 10</td>
            <td><span class="pill ${v.oos ? 'pill-critical' : 'pill-minimal'}">${v.oos ? 'Yes' : 'No'}</span></td>
            <td><a href="violation.html?id=${v.id}">Case →</a></td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-state">No violations were found during this inspection.</div>`}
    </div>
  `;
</script>
</body>
</html>
