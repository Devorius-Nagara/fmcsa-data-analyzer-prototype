<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Companies</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>
<div class="app-shell">
  <div data-sidebar></div>
  <div class="main-content">
<div class="page">
  <div id="back"></div>

  <div>
    <h1 style="margin:0 0 4px 0; font-size:24px; font-weight:700;">Companies</h1>
    <div style="font-size:14px; color:#52514e;">Carriers on file — active only by default</div>
  </div>

  <div class="card" style="padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <input id="search" class="select" style="min-width:220px; padding:7px 10px; font-size:13px;" placeholder="Search company or DOT">
    <select id="provider-filter" class="select" style="min-width:150px; padding:7px 10px; font-size:13px;">
      <option value="">All providers</option>
    </select>
    <div class="segmented" id="status-filter">
      <button data-val="active" class="active">Active</button>
      <button data-val="inactive">Inactive</button>
      <button data-val="all">All</button>
    </div>
    <div class="segmented" id="client-filter">
      <button data-val="" class="active">All</button>
      <button data-val="1">Client</button>
      <button data-val="0">Not a client</button>
    </div>
    <div style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:#52514e;">
      Min score
      <input id="min-score" type="number" min="0" max="100" value="0" class="select" style="width:64px; padding:7px 8px; font-size:13px;">
    </div>
  </div>

  <div class="card" style="overflow:hidden;">
    <table>
      <thead>
        <tr>
          <th><span class="th-sort" data-sort="name">Company</span></th>
          <th>DOT</th>
          <th>Provider</th>
          <th><span class="th-sort active" data-sort="score">Score</span></th>
          <th><span class="th-sort" data-sort="inspections">Inspections</span></th>
          <th><span class="th-sort" data-sort="tamperings">Tamperings</span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="company-rows"></tbody>
    </table>
    <div id="company-count" style="padding:12px 18px; font-size:11.5px; color:#898781; border-top:1px solid #e1e0d9;"></div>
  </div>
</div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('back').innerHTML = breadcrumb([
    { label: 'Dashboard', href: 'index.html' },
    { label: 'Companies' },
  ]);

  const providerFilterEl = document.getElementById('provider-filter');
  const searchEl = document.getElementById('search');
  const clientFilterEl = document.getElementById('client-filter');
  const statusFilterEl = document.getElementById('status-filter');
  const minScoreEl = document.getElementById('min-score');
  const rowsEl = document.getElementById('company-rows');
  const countEl = document.getElementById('company-count');

  providerFilterEl.innerHTML = '<option value="">All providers</option>' +
    PROVIDERS.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

  const withInspections = COMPANIES.map(c => ({ ...c, inspections: getInspectionsForCompany(c.dot).length }));

  let sortField = 'score';
  let sortDir = 1;
  let clientVal = '';
  let statusVal = 'active';

  function renderCompanies() {
    const providerVal = providerFilterEl.value;
    const q = searchEl.value.trim().toLowerCase();
    const minScore = Number(minScoreEl.value) || 0;

    const inScope = withInspections.filter(c =>
      statusVal === 'active' ? c.active : statusVal === 'inactive' ? !c.active : true);

    let rows = inScope.filter(c => {
      if (providerVal && c.provider !== providerVal) return false;
      if (clientVal !== '' && String(c.client ? 1 : 0) !== clientVal) return false;
      if (c.score < minScore) return false;
      if (q && !(c.name.toLowerCase().includes(q) || c.dot.includes(q))) return false;
      return true;
    });

    rows.sort((a, b) => {
      let av = a[sortField], bv = b[sortField];
      if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });

    rowsEl.innerHTML = rows.length ? rows.map(c => {
      const provider = getProvider(c.provider);
      return `
      <tr class="row-link" onclick="location.href='company.html?dot=${c.dot}'">
        <td>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:600; ${c.client ? '' : 'color:#52514e;'}">${c.name}</span>
            ${clientBadge(c.client)}
          </div>
        </td>
        <td class="mono" style="color:#52514e;">${c.dot}</td>
        <td>${provider ? provider.name : '—'}</td>
        <td>${scorePill(c.score, c.hasDetail)}</td>
        <td class="mono">${c.inspections}</td>
        <td class="mono">${c.tamperings}</td>
        <td><a href="company.html?dot=${c.dot}">Company →</a></td>
      </tr>`;
    }).join('') : '';

    countEl.textContent = rows.length
      ? `Showing ${rows.length} of ${inScope.length} companies`
      : '';
    if (!rows.length) {
      rowsEl.innerHTML = `<tr><td colspan="7"><div class="empty-state">No companies match these filters.</div></td></tr>`;
    }
  }

  document.querySelectorAll('.th-sort').forEach(el => {
    el.innerHTML += ' ' + icon(ICONS.sort, { size: 11, stroke: '#0b0b0b', sw: 2.5 });
    el.addEventListener('click', () => {
      const field = el.dataset.sort;
      if (sortField === field) sortDir *= -1; else { sortField = field; sortDir = 1; }
      document.querySelectorAll('.th-sort').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      renderCompanies();
    });
  });

  clientFilterEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      clientVal = btn.dataset.val;
      clientFilterEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCompanies();
    });
  });

  statusFilterEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      statusVal = btn.dataset.val;
      statusFilterEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCompanies();
    });
  });

  providerFilterEl.addEventListener('change', renderCompanies);
  searchEl.addEventListener('input', renderCompanies);
  minScoreEl.addEventListener('input', renderCompanies);

  renderCompanies();
</script>
</body>
</html>
