<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Provider</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>

<div class="page" id="page"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const id = qs('id') || PROVIDERS[0].id;
  const provider = getProvider(id) || PROVIDERS[0];
  const companies = COMPANIES.filter(c => c.provider === provider.id);
  const oosRate = companies.length ? (companies.reduce((s, c) => s + c.oosRate, 0) / companies.length).toFixed(1) : '0.0';

  const buckets = [
    { label: '0–39',  min: 0,  max: 39,  color: '#d03b3b' },
    { label: '40–59', min: 40, max: 59,  color: '#ec835a' },
    { label: '60–79', min: 60, max: 79,  color: '#fab219' },
    { label: '80–100',min: 80, max: 100, color: '#0ca30c' },
  ].map(b => ({ ...b, count: companies.filter(c => c.score >= b.min && c.score <= b.max).length }));
  const maxCount = Math.max(1, ...buckets.map(b => b.count));

  document.getElementById('page').innerHTML = `
    ${backLink('index.html', 'Back to dashboard')}

    <div class="card" style="padding:24px 28px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:20px;">
        <div style="width:52px; height:52px; border-radius:10px; background:#f3ecfa; display:flex; align-items:center; justify-content:center;">
          ${icon(ICONS.provider, { size: 26, stroke: '#4a3aa7', sw: 2 })}
        </div>
        <div>
          <div style="font-size:20px; font-weight:700;">${provider.name}</div>
          <div style="font-size:13px; color:#52514e; margin-top:6px;">ELD provider · ${companies.length} client compan${companies.length === 1 ? 'y' : 'ies'}</div>
        </div>
      </div>
      <div style="display:flex; gap:36px;">
        <div style="text-align:right;">
          <div style="font-size:11px; color:#898781; text-transform:uppercase; letter-spacing:0.04em;">Average score</div>
          <div class="mono" style="font-size:26px; font-weight:600;">${provider.avgScore}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px; color:#898781; text-transform:uppercase; letter-spacing:0.04em;">Tamperings (30d)</div>
          <div class="mono" style="font-size:26px; font-weight:600;">${provider.tamperings}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px; color:#898781; text-transform:uppercase; letter-spacing:0.04em;">OOS rate</div>
          <div class="mono" style="font-size:26px; font-weight:600;">${oosRate}%</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:22px 24px; display:flex; flex-direction:column; gap:16px;">
      <div style="font-size:14px; font-weight:600;">Company score distribution</div>
      <div style="display:flex; align-items:flex-end; gap:8px; height:140px;">
        ${buckets.map(b => `
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
            <span class="mono" style="font-size:12px; color:#52514e;">${b.count}</span>
            <div style="width:100%; height:${Math.max(4, Math.round(b.count / maxCount * 120))}px; background:${b.color}; border-radius:4px 4px 0 0;"></div>
            <span style="font-size:11px; color:#898781;">${b.label}</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="card" style="overflow:hidden;">
      <div style="padding:20px 24px; border-bottom:1px solid #e1e0d9; font-size:14px; font-weight:600;">Companies on ${provider.name}</div>
      ${companies.length ? `
      <table>
        <thead><tr><th>Company</th><th>DOT</th><th>Score</th><th>Tickets</th><th>Tamperings</th><th></th></tr></thead>
        <tbody>
          ${companies.map(c => `
          <tr class="row-link" onclick="location.href='company.html?dot=${c.dot}'">
            <td>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-weight:600; ${c.client ? '' : 'color:#52514e;'}">${c.name}</span>
                ${clientBadge(c.client)}
              </div>
            </td>
            <td class="mono" style="color:#52514e;">${c.dot}</td>
            <td>${scorePill(c.score)}</td>
            <td class="mono">${c.tickets === null ? '<span style="color:#c3c2b7;">—</span>' : c.tickets}</td>
            <td class="mono">${c.tamperings}</td>
            <td><a href="company.html?dot=${c.dot}">Company →</a></td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-state">No companies on this provider in the demo data.</div>`}
    </div>
  `;
</script>
</body>
</html>
