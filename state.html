<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — State breakdown</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>
<div class="app-shell">
  <div data-sidebar></div>
  <div class="main-content">
<div class="page">
  <div id="back"></div>

  <div>
    <h1 style="margin:0 0 4px 0; font-size:24px; font-weight:700;">Tamperings by state</h1>
    <div style="font-size:14px; color:#52514e;">ELD-tampering cases (inspections with a tampering finding), last 24 months</div>
  </div>

  <div id="tiles" style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px;"></div>

  <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;">
    <div class="card" style="padding:22px 24px; display:flex; flex-direction:column; gap:14px;">
      <div style="font-size:14px; font-weight:600;">All states, ranked</div>
      <div id="state-list" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>

    <div class="card" style="padding:22px 24px; display:flex; flex-direction:column; gap:14px;">
      <div>
        <div style="font-size:14px; font-weight:600;" id="trend-title">Trend</div>
        <div style="font-size:12px; color:#898781;" id="trend-sub">ELD-tampering violations per month</div>
      </div>
      <div id="trend-chart"></div>
      <div style="font-size:12px; color:#898781;" id="trend-foot"></div>
    </div>
  </div>

  <div class="card" style="overflow:hidden;">
    <div style="padding:20px 24px; border-bottom:1px solid #e1e0d9; display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:14px; font-weight:600;" id="companies-title">Companies with tamperings</div>
      <span class="pill pill-info" id="companies-count-pill"></span>
    </div>
    <div id="companies-table"></div>
  </div>
</div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  let currentState = qs('state') || STATES[0].code;

  function renderBarChart(buckets, max) {
    const w = 420, h = 150, pad = 6;
    const bw = (w - pad * 2) / buckets.length;
    const bars = buckets.map((b, i) => {
      const bh = max > 0 ? Math.max(1, (b.tamperings / max) * (h - 20)) : 1;
      const x = pad + i * bw;
      const y = h - bh;
      return `<rect x="${(x + 2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="#4a3aa7"></rect>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
        <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#c3c2b7" stroke-width="1"/>
        ${bars}
      </svg>`;
  }

  function render() {
    const list = [...STATES].sort((a, b) => b.count - a.count);
    const total = list.reduce((s, x) => s + x.count, 0);
    const top = list[0];
    const stateObj = list.find(s => s.code === currentState) || top;
    currentState = stateObj.code;

    document.getElementById('back').innerHTML = breadcrumb([
      { label: 'Dashboard', href: 'index.html' },
      { label: `${stateObj.name} (${stateObj.code})` },
    ]);

    const selRate = stateObj.inspections ? (stateObj.count / stateObj.inspections * 100) : 0;

    document.getElementById('tiles').innerHTML = `
      <div class="card" style="padding:20px;">
        <div style="font-size:13px; color:#52514e; margin-bottom:10px;">Total tampering cases</div>
        <div class="mono" style="font-size:28px; font-weight:600;">${total}</div>
        <div style="font-size:12px; color:#898781; margin-top:6px;">across ${list.length} states</div>
      </div>
      <div class="card" style="padding:20px;">
        <div style="font-size:13px; color:#52514e; margin-bottom:10px;">Top state</div>
        <div class="mono" style="font-size:28px; font-weight:600;">${top.code}</div>
        <div style="font-size:12px; color:#898781; margin-top:6px;">${top.count} cases · ${total ? (top.count / total * 100).toFixed(1) : '0.0'}% of total</div>
      </div>
      <div class="card" style="padding:20px;">
        <div style="font-size:13px; color:#52514e; margin-bottom:10px;">${stateObj.code} tampering rate</div>
        <div class="mono" style="font-size:28px; font-weight:600;">${selRate.toFixed(1)}%</div>
        <div style="font-size:12px; color:#898781; margin-top:6px;">${stateObj.count} of ${stateObj.inspections.toLocaleString()} inspections</div>
      </div>
      <div class="card" style="padding:20px;">
        <div style="font-size:13px; color:#52514e; margin-bottom:10px;">${stateObj.code} inspections</div>
        <div class="mono" style="font-size:28px; font-weight:600;">${stateObj.inspections.toLocaleString()}</div>
        <div style="font-size:12px; color:#898781; margin-top:6px;">roadside stops, last 24 months</div>
      </div>`;

    const max = list[0].count || 1;
    document.getElementById('state-list').innerHTML = list.map((s, i) => `
      <a class="rank-row" href="state.html?state=${s.code}" style="${s.code === currentState ? 'font-weight:600;' : ''}" onclick="event.preventDefault(); selectState('${s.code}');">
        <span class="rank-num">${i + 1}</span>
        <span class="rank-name">${s.name} (${s.code})</span>
        <span class="rank-track"><span class="rank-fill" style="width:${Math.round(s.count / max * 100)}%; background:#4a3aa7;"></span></span>
        <span class="rank-val mono">${s.count}</span>
      </a>`).join('');

    // Synthetic monthly trend for the selected state, last 24 months.
    const series = buildInspectionSeries('month', '2025-01-01', '2025-12-31', stateObj.code);
    const maxTamper = Math.max(1, ...series.buckets.map(b => b.tamperings));
    document.getElementById('trend-title').textContent = `Trend — ${stateObj.name}`;
    document.getElementById('trend-sub').textContent = `ELD-tampering violations per month · ${stateObj.code}`;
    document.getElementById('trend-chart').innerHTML = renderBarChart(series.buckets, maxTamper);
    document.getElementById('trend-foot').textContent = `${series.tamperingsTotal} tampering violations in ${stateObj.code} over the last 24 months · ${series.total} inspections total.`;

    document.getElementById('companies-title').textContent = `Companies with tamperings in ${stateObj.name} (${stateObj.code})`;
    document.getElementById('companies-count-pill').textContent = `${stateObj.count} cases`;

    const inState = COMPANIES.filter(c => INSPECTIONS.some(i => i.dot === c.dot && i.state === stateObj.code) && c.tamperings > 0)
      .sort((a, b) => b.tamperings - a.tamperings);
    const tableEl = document.getElementById('companies-table');
    if (inState.length) {
      tableEl.innerHTML = `
        <table>
          <thead><tr><th>Company</th><th>DOT</th><th>Provider</th><th>Tamperings</th><th>Score</th><th></th></tr></thead>
          <tbody>
            ${inState.map(c => {
              const provider = getProvider(c.provider);
              return `
              <tr class="row-link" onclick="location.href='company.html?dot=${c.dot}'">
                <td style="font-weight:600;">${c.name}</td>
                <td class="mono" style="color:#52514e;">${c.dot}</td>
                <td>${provider ? provider.name : '—'}</td>
                <td class="mono">${c.tamperings}</td>
                <td>${scorePill(c.score, c.hasDetail)}</td>
                <td><a href="company.html?dot=${c.dot}">Company →</a></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    } else {
      tableEl.innerHTML = `<div class="empty-state">No company records with tamperings in ${stateObj.name}.</div>`;
    }
  }

  window.selectState = (code) => { currentState = code; render(); };

  render();
</script>
</body>
</html>
