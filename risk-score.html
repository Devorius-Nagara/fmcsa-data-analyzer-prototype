<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Risk Score</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>

<div class="page narrower" id="page"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const dot = qs('dot') || COMPANIES[0].dot;
  const c = getCompany(dot) || COMPANIES[0];
  const tier = scoreTier(c.score);
  const tierColor = { Minimal: '#0ca30c', Elevated: '#fab219', Critical: '#d03b3b' }[tier.label];
  const tierPillClass = { Minimal: 'pill-minimal', Elevated: 'pill-elevated', Critical: 'pill-critical' }[tier.label];
  const tierIcon = { Minimal: ICONS.check, Elevated: ICONS.warn, Critical: ICONS.warn }[tier.label];

  /* Exact arc-endpoint math: center (90,100), radius 76, semicircle from
     (14,100) at score=0 to (166,100) at score=100, sweeping through the top. */
  function gaugeArcEnd(score) {
    const f = Math.max(0, Math.min(1, score / 100));
    const angle = f * Math.PI;
    const x = 90 - 76 * Math.cos(angle);
    const y = 100 - 76 * Math.sin(angle);
    return { x: x.toFixed(1), y: y.toFixed(1) };
  }
  const end = gaugeArcEnd(c.score);

  function bar(label, value, display, color) {
    return `
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;"><span>${label}</span><span class="mono">${display}</span></div>
        <div class="rank-track" style="height:8px;"><div class="rank-fill" style="width:${value}%; background:${color};"></div></div>
      </div>`;
  }

  document.getElementById('page').innerHTML = `
    ${backLink(`company.html?dot=${c.dot}`, `Back to company — ${c.name}`)}

    <div style="margin-bottom:4px;">
      <div style="font-size:20px; font-weight:700;">Risk Score — ${c.name}</div>
      <div style="font-size:13px; color:#52514e; margin-top:4px;">Internal risk indicator. Not the official FMCSA SMS score.</div>
    </div>

    <div class="card" style="padding:26px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <span style="font-size:13px; font-weight:600; color:#52514e;">${c.name}</span>
        <span class="pill ${tierPillClass}">${icon(tierIcon, { size: 13, stroke: tierColor, sw: 2.5 })} ${tier.label}</span>
      </div>

      <div style="display:flex; justify-content:center; margin-bottom:16px;">
        <svg width="220" height="135" viewBox="0 0 180 110">
          <path d="M14 100 A76 76 0 0 1 166 100" fill="none" stroke="#e1e0d9" stroke-width="14" stroke-linecap="round"/>
          <path d="M14 100 A76 76 0 0 1 ${end.x} ${end.y}" fill="none" stroke="${tierColor}" stroke-width="14" stroke-linecap="round"/>
          <text x="90" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="36" font-weight="600" fill="#0b0b0b">${c.score}</text>
          <text x="90" y="100" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#898781">of 100</text>
        </svg>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px; max-width:420px; margin:0 auto;">
        ${bar('OOS rate', Math.min(100, c.oosRate / 35 * 100), c.oosRate.toFixed(1) + '%', '#2a78d6')}
        ${bar('Violations / inspection', Math.min(100, c.violPerInspection / 1.2 * 100), c.violPerInspection.toFixed(2), '#2a78d6')}
        ${bar('Crash rate', Math.min(100, c.crashRate / 7 * 100), c.crashRate.toFixed(1) + '%', '#2a78d6')}
        ${bar('Fatal crashes', Math.min(100, c.fatalCrashes / 1 * 90 + (c.fatalCrashes ? 10 : 0)), c.fatalCrashes + (c.fatalCrashes ? ' (12 mo)' : ''), '#2a78d6')}
        ${bar('Data staleness', Math.min(100, c.dataStalenessDays / 20 * 100), c.dataStalenessDays + ' days', '#2a78d6')}
      </div>
    </div>

    <div class="notice">
      ${icon(ICONS.warn, { size: 18, stroke: '#9c3d1c' })}
      <div class="text">
        <b style="color:#0b0b0b;">This is an internal score, not the official FMCSA SMS score.</b>
        Calculated from preliminary (daily) data and may differ from the official snapshot, which is published monthly.
      </div>
    </div>
  `;
</script>
</body>
</html>
