<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Providers</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>
<div class="app-shell">
  <div data-sidebar></div>
  <div class="main-content">
<div class="page">
  <div id="back"></div>

  <div>
    <h1 style="margin:0 0 4px 0; font-size:24px; font-weight:700;">ELD providers</h1>
    <div style="font-size:14px; color:#52514e;">All providers used by client companies</div>
  </div>

  <div class="card" style="padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <input id="search" class="select" style="min-width:220px; padding:7px 10px; font-size:13px;" placeholder="Search provider">
    <div class="segmented" id="data-filter">
      <button data-val="all" class="active">All</button>
      <button data-val="with">With data</button>
      <button data-val="without">No data</button>
    </div>
  </div>

  <div class="card" style="overflow:hidden;">
    <table>
      <thead><tr><th>Provider</th><th>Companies</th><th>Average score</th><th>Tamperings (30D)</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('back').innerHTML = breadcrumb([
    { label: 'Dashboard', href: 'index.html' },
    { label: 'Providers' },
  ]);

  const rowsEl = document.getElementById('rows');
  const searchEl = document.getElementById('search');
  const dataFilterEl = document.getElementById('data-filter');
  let q = '';
  let dataFilter = 'all';

  function render() {
    const withCount = PROVIDERS.map(p => ({ ...p, companies: COMPANIES.filter(c => c.provider === p.id).length, hasDetail: p.avgScore > 0 }));
    let rows = withCount.filter(p => {
      if (dataFilter === 'with' && !p.hasDetail) return false;
      if (dataFilter === 'without' && p.hasDetail) return false;
      if (q && !p.name.toLowerCase().includes(q)) return false;
      return true;
    });
    // no-data providers always sink to the bottom, whatever the ranking
    const withData = rows.filter(p => p.hasDetail).sort((a, b) => a.avgScore - b.avgScore);
    const noData = rows.filter(p => !p.hasDetail);
    rows = [...withData, ...noData];

    rowsEl.innerHTML = rows.length ? rows.map(p => `
    <tr class="row-link" onclick="location.href='provider.html?id=${p.id}'">
      <td style="font-weight:600;">${p.name}</td>
      <td class="mono">${p.companies}</td>
      <td>${scorePill(p.avgScore, p.hasDetail)}</td>
      <td class="mono">${p.tamperings}</td>
      <td><a href="provider.html?id=${p.id}">Provider →</a></td>
    </tr>`).join('') : `<tr><td colspan="5"><div class="empty-state">No providers match these filters.</div></td></tr>`;
  }

  searchEl.addEventListener('input', () => { q = searchEl.value.trim().toLowerCase(); render(); });
  dataFilterEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      dataFilter = btn.dataset.val;
      dataFilterEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  render();
</script>
</body>
</html>
