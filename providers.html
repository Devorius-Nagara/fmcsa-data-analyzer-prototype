<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMCSA Data Analyzer — Providers</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-topbar></div>

<div class="page">
  <div id="back"></div>

  <div>
    <h1 style="margin:0 0 4px 0; font-size:24px; font-weight:700;">ELD providers</h1>
    <div style="font-size:14px; color:#52514e;">All providers used by client companies</div>
  </div>

  <div class="card" style="overflow:hidden;">
    <table>
      <thead><tr><th>Provider</th><th>Companies</th><th>Average score</th><th>Tamperings (30d)</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('back').innerHTML = backLink('index.html', 'Back to dashboard');

  const rowsEl = document.getElementById('rows');
  const rows = [...PROVIDERS].sort((a, b) => a.avgScore - b.avgScore);
  rowsEl.innerHTML = rows.map(p => {
    const count = COMPANIES.filter(c => c.provider === p.id).length;
    return `
    <tr class="row-link" onclick="location.href='provider.html?id=${p.id}'">
      <td style="font-weight:600;">${p.name}</td>
      <td class="mono">${count}</td>
      <td>${scorePill(p.avgScore)}</td>
      <td class="mono">${p.tamperings}</td>
      <td><a href="provider.html?id=${p.id}">Provider →</a></td>
    </tr>`;
  }).join('');
</script>
</body>
</html>
